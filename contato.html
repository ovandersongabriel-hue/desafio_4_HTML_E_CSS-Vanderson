    <main class="contato">
        <img src="./img/XL Cabine.jpg" alt="">
        <form class="form_contato" action="">
            <h1 class="titulo_contato">Sobre você</h1>
            <input type="text" placeholder="NOME" required>
            <input type="email"placeholder="EMAIL" required>
            <input type="text"placeholder="CPF" required>
            <input type="phone"placeholder="TELEFONE" required>
            <select name="" id="" required>
                <option value="">Selecione o tipo de contato</option>
                <option value="">Elogio</option>
                <option value="">Reclamação</option>
                <option value="">Solicitação</option>
            </select>
            <textarea class="titulo_mensagem" name="" id="" placeholder="Mensagem"></textarea>
            <button class="but_enviar" type="submit">Enviar</button>
        </form>
    </main>
 <footer class="rodape">
