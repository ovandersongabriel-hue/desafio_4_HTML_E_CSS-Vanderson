    <main class="main_video">
        <iframe width="100%" height="450" src="https://www.youtube.com/embed/vQsryuNmsL0"

            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

            <div class="comparar_carros"><table class="main_table">
            <tr>
                <td><img class="main_img" src="./img/XL Cabine.jpg" alt="">
                    <div class="escolha_carro"><input type="checkbox" name="" id=""><div class="descricao_inf">
                        <p class="nome_carro"> XL Cabine Simples 2.2 Diesel 4X4 MT 2022</p>
                        <p class="preco_carro" >Preço Sugerido: R$ 183.850</p>
                    </div><img alt="icone-info" src="./img/info.png" class="info-icon"></div></div>
                </td>
                <td><img class="main_img" src="./img/xls 2.2 diesel.jpg" alt="">

                        <p class="preco_carro">Preço Sugerido: R$ 220.690</p>
                    </div><img alt="icone-info" src="./img/info.png" class="info-icon"></div>
                </td>
                <td><img class="main_img" src="./img/storm.jpg" alt="">
                    <div class="escolha_carro"><input type="checkbox">
                    <div class="descricao_inf">
                        <p class="nome_carro">Storm 3.2 Diesel 4X4 AT 2022</p>
                        <p class="preco_carro">Preço Sugerido: R$ 222.790</p>
                    </div>
                <img alt="icone-info" src="./img/info.png" class="info-icon">
                </div>
                </td>
            </tr>
        </table>
        <button class="but_carros">Comparar carros</button>

        </div>
    </main>
    <footer class="rodape">
